plugins {
    id "com.android.application"
}

def thirdParty = file("../third_party")
def clientSource = file("../../src/client")
def generatedAssets = layout.buildDirectory.dir("generated/journeyAssets")
// Game server and asset host are build-time settings so the n150's Tailscale
// address stays out of this public repo. Set them with a Gradle property
// (-PserverIp=<address> -PassetsUrl=<url>, or in ~/.gradle/gradle.properties)
// or the HEAVEN_SERVER_IP / HEAVEN_ASSETS_URL environment variables. CI reads
// them from the repository variables of the same names.
def serverIp = project.findProperty("serverIp") ?: System.getenv("HEAVEN_SERVER_IP") ?: "127.0.0.1"
// An empty assets URL turns streaming and the download screen's default off.
def assetsUrl = project.findProperty("assetsUrl") ?: System.getenv("HEAVEN_ASSETS_URL") ?: ""
if (!project.findProperty("serverIp") && !System.getenv("HEAVEN_SERVER_IP")) {
    logger.warn("serverIp/HEAVEN_SERVER_IP not set: the APK will connect to 127.0.0.1")
}

android {
    namespace "com.saijinjun.heavenclient"
    compileSdk 35
    ndkVersion "27.2.12479018"

    defaultConfig {
        applicationId "com.saijinjun.heavenclient"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "0.1"

        buildConfigField "String", "ASSETS_URL", "\"${assetsUrl}\""

        externalNativeBuild {
            cmake {
                arguments "-DSDL2_SOURCE_DIR=${new File(thirdParty, "SDL2").absolutePath}",
                          "-DFREETYPE_SOURCE_DIR=${new File(thirdParty, "freetype").absolutePath}",
                          "-DANDROID_STL=c++_static",
                          "-DWARNINGS_AS_ERRORS=OFF",
                          "-DJOURNEY_DEFAULT_SERVER_IP=${serverIp}",
                          "-DJOURNEY_ASSETS_URL=${assetsUrl}"
            }
        }

        ndk {
            abiFilters "arm64-v8a"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // Signed with the debug key so the APK installs directly. Fine for
            // personal sideloading, not for a store release.
            signingConfig signingConfigs.debug
        }
    }

    externalNativeBuild {
        cmake {
            path "${clientSource}/CMakeLists.txt"
        }
    }

    sourceSets {
        main {
            // SDL's Java activity and helpers come from the SDL2 source release.
            java.srcDirs += new File(thirdParty, "SDL2/android-project/app/src/main/java")
            assets.srcDirs += generatedAssets
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Fonts are bundled as assets; the game copies them to its data folder.
def copyFonts = tasks.register("copyFonts", Copy) {
    from(new File(clientSource, "fonts")) {
        into "fonts"
    }
    into generatedAssets
}

preBuild.dependsOn copyFonts

preBuild.doFirst {
    if (!new File(thirdParty, "SDL2/CMakeLists.txt").exists() ||
        !new File(thirdParty, "freetype/CMakeLists.txt").exists()) {
        throw new GradleException("Native dependencies are missing. Run android/fetch-deps.sh first.")
    }
}

dependencies {
    testImplementation "junit:junit:4.13.2"
}
